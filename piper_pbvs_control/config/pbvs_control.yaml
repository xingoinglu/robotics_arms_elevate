piper_pbvs_controller:
  ros__parameters:
    # Safety interlocks: both must be true for physical pressing.
    enable_motion: false
    enable_press: false

    base_frame: base_link
    tcp_frame: tcp_link
    flange_frame: link6
    camera_link_frame: camera_link
    move_group_name: arm
    # Keep the task-start TCP roll and only align tool +Z to the press axis.
    # Set world_up to restore the detector's complete orientation.
    orientation_mode: preserve_current_roll

    coarse_standoff: 0.08
    # Coarse acceptance uses the button frame: local XY is panel lateral,
    # local Z is the press-axis distance. Retry the same C0 once if needed.
    coarse_lateral_tolerance: 0.005
    coarse_axial_tolerance: 0.01
    coarse_correction_attempts: 1
    prepress_standoff: 0.005
    press_overtravel: 0.003
    hold_duration: 0.5

    control_rate: 10.0
    translation_gain: 0.5
    rotation_gain: 0.5
    align_max_translation_step: 0.002
    press_max_translation_step: 0.001
    max_rotation_step: 0.034906585
    position_tolerance: 0.003
    press_position_tolerance: 0.0015
    angular_tolerance: 0.052359878

    stable_sample_count: 5
    stable_position_spread: 0.003
    stable_angle_spread: 0.052359878
    stable_cycle_count: 5
    target_acquire_timeout: 5.0
    # After MoveIt changes the eye-in-hand viewpoint, require fresh samples.
    target_reacquire_timeout: 8.0
    reacquire_max_normal_drift: 0.02
    target_pause_age: 0.5
    target_abort_age: 2.0
    tcp_feedback_timeout: 0.5
    moveit_timeout: 20.0
    pbvs_timeout: 10.0
    press_timeout: 3.0
    retract_timeout: 8.0

    max_pbvs_displacement: 0.10
    max_press_travel: 0.012
    max_press_lateral_error: 0.004
    tcp_offset_x: 0.0
    tcp_offset_y: 0.0
    tcp_offset_z: 0.1468

    moveit_position_tolerance: 0.002
    moveit_orientation_tolerance: 0.05
    panel_width: 0.6
    panel_height: 1.2
    panel_thickness: 0.02
    camera_collision_enabled: true
    camera_size_x: 0.10
    camera_size_y: 0.04
    camera_size_z: 0.04
